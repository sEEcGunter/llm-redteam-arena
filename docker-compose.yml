services:
  webapp:
    build: ./webapp
    container_name: novatech-webapp
    ports:
      - "5000:5000"
    environment:
      - LLM_URL=http://host.docker.internal:1234
      - MODEL=mistralai/mistral-7b-instruct-v0.3
      - DB_PATH=/app/data/feedback.db
      - CHROMA_PATH=/app/data/chroma
    volumes:
      - app_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

volumes:
  app_data:
